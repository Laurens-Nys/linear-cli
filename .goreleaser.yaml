# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# Bun compiles the single binary; GoReleaser only packages and publishes it.
# The bun builder needs GoReleaser v2.6+; homebrew_casks needs v2.10+.
# CI and release workflows pin the action to `~> v2.10` so both stay compatible.
# GitHub release publication is gated in .github/workflows/release.yml by
# LIN_RELEASE_PUBLISH plus the protected `release` environment.
# Homebrew cask upload is skip_upload: true until a separate tap approval.
# Do not add HOMEBREW_TAP_TOKEN or notarize until that approval.
version: 2

project_name: lin

before:
  hooks:
    # OpenTUI selects a native package for each Bun cross-compile target.
    - bun install --frozen-lockfile --os="*" --cpu="*"

builds:
  - id: lin
    builder: bun
    binary: lin
    main: ./src/main.ts
    # `bun-` is prefixed automatically. Bun cross-compiles, so one Linux runner
    # produces every artifact.
    targets:
      - darwin-arm64
      - darwin-x64
      - linux-x64
      - linux-arm64

archives:
  - id: lin
    ids: [lin]
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - THIRD_PARTY_NOTICES.md

checksum:
  name_template: checksums.txt

release:
  github:
    owner: Laurens-Nys
    name: linear-cli
  prerelease: auto

homebrew_casks:
  # The tap repository must already exist before the first stable tag.
  # skip_upload stays true until a separate tap approval explicitly changes it
  # and uncomments HOMEBREW_TAP_TOKEN. Revert both afterward.
  - name: lin
    repository:
      owner: Laurens-Nys
      name: homebrew-tap
      # Pushing to another repository needs a token with write access to the
      # tap; GITHUB_TOKEN cannot do it. Add the secret, then uncomment.
      # token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/Laurens-Nys/linear-cli
    description: Linear CLI for coding agents
    license: MIT
    skip_upload: true
    hooks:
      post:
        # The binary is not notarized, so macOS would quarantine it.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/lin"]
          end
